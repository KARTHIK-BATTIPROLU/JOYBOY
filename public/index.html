<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOYBOY — Red Hair Shanks AI Voice Chatbot</title>
  <!-- Google Fonts: Cinzel & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏴‍☠️</text></svg>">
</head>
<body>

  <!-- Ocean Ambient Lighting -->
  <div class="ocean-ambient"></div>

  <!-- Top Alert / Toast Banner -->
  <div id="alertBanner" class="alert-banner"></div>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-section">
      <svg class="jolly-roger-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Crossed Gryphon Sabers & Straw Hat Skull Silhouette -->
        <circle cx="50" cy="50" r="46" stroke="#e5b358" stroke-width="2" stroke-dasharray="4 2"/>
        <path d="M 22 78 L 78 22" stroke="#d11a2a" stroke-width="5" stroke-linecap="round"/>
        <path d="M 22 22 L 78 78" stroke="#d11a2a" stroke-width="5" stroke-linecap="round"/>
        <circle cx="50" cy="46" r="22" fill="#14171e" stroke="#e5b358" stroke-width="3"/>
        <circle cx="43" cy="44" r="3.5" fill="#e5b358"/>
        <circle cx="57" cy="44" r="3.5" fill="#e5b358"/>
        <!-- 3 Scars -->
        <line x1="54" y1="34" x2="60" y2="48" stroke="#ff2a3d" stroke-width="2"/>
        <line x1="57" y1="34" x2="63" y2="48" stroke="#ff2a3d" stroke-width="2"/>
        <line x1="60" y1="36" x2="66" y2="48" stroke="#ff2a3d" stroke-width="2"/>
        <path d="M 42 56 Q 50 62 58 56" stroke="#e5b358" stroke-width="2" fill="none"/>
      </svg>
      <div>
        <h1 class="brand-title">JOYBOY</h1>
        <p class="brand-subtitle">Red Hair Shanks — Emperor of the Sea</p>
      </div>
    </div>

    <!-- Live Telemetry Status Pills -->
    <div class="status-pills">
      <div id="pttStatusPill" class="status-pill">
        <span class="status-dot"></span> Ready (Push to Talk)
      </div>
      <div class="status-pill">
        <span>⚡ Gemini 3.5 Flash</span>
      </div>
      <div class="status-pill">
        <span>🎙️ Deepgram Aura (Zeus)</span>
      </div>
    </div>
  </header>

  <!-- Main Stage Layout -->
  <main class="main-stage">
    
    <!-- Left: 2D Interactive Avatar Stage -->
    <section class="character-viewport">
      
      <!-- Avatar & Canvas Stage Container -->
      <div class="avatar-container" id="avatarStage">
        <canvas id="hakiCanvas"></canvas>
        <div id="avatarContainer"></div>

        <!-- Dynamic Speech Bubble Overlay -->
        <div id="speechBubbleOverlay" class="speech-bubble-overlay">
          <div class="bubble-character-name">SHANKS</div>
          <div id="bubbleDialogueText" class="bubble-dialogue-text">Dahahahaha!</div>
        </div>
      </div>

      <!-- Controls & Interaction Deck -->
      <div class="interaction-deck">
        <div class="ptt-master-row">
          
          <!-- Conqueror's Haki VFX Button -->
          <button id="hakiButton" class="action-btn" title="Unleash Haoshoku Haki">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
          </button>

          <!-- Primary Push-To-Talk Button -->
          <button id="pttButton" class="ptt-button" title="Click & Hold to Speak">
            <div class="ptt-ripple-ring"></div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <span class="ptt-label">HOLD</span>
          </button>

          <!-- Volume / Mute Toggle Placeholder -->
          <button id="volumeBtn" class="action-btn" title="Voice Enabled">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
          </button>
        </div>

        <!-- Spacebar Hint -->
        <p class="ptt-hint-text">Hold <kbd>Spacebar</kbd> or click & hold the button to speak</p>

        <!-- Text Fallback Console -->
        <div class="text-input-console">
          <input type="text" id="textChatInput" placeholder="Speak with Shanks or type your message here..." autocomplete="off">
          <button id="sendChatBtn" class="send-btn" title="Send Message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>

    </section>

    <!-- Right: Captain's Log (Transcript Display) -->
    <aside class="transcript-drawer">
      <div class="drawer-header">
        <h2 class="drawer-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          Captain's Log
        </h2>
        <button id="clearLogBtn" class="clear-log-btn">Clear Log</button>
      </div>

      <!-- Scrollable Message Bubbles -->
      <div id="messagesContainer" class="messages-container"></div>
    </aside>

  </main>

  <!-- Application Logic Scripts -->
  <script src="js/avatar.js"></script>
  <script src="js/haki.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
